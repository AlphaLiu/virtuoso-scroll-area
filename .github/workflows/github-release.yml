name: GitHub Release

# Creates the GitHub Release for a version that is already on npm.
#
# Approval itself happens on npmjs.com: `release.yml` stages a tarball, a maintainer clicks
# **Approve** in the npm UI, and only then is the version installable. That click is invisible to
# GitHub, so this workflow cannot run itself — a human dispatches it once the npm UI shows the
# version as published.
#
# It refuses to create a Release for a version that is not on the registry: pointing a Release at
# an uninstallable version is worse than having no Release at all.
#
# See RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version that was approved on npm (e.g. 0.3.0).
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Create the GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve the tag and validate the input
        id: target
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            ''|*[!0-9A-Za-z.+-]*) echo "::error::invalid version '${VERSION}'"; exit 1 ;;
          esac
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION}"

      - name: Check the tag exists
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} is not on origin — stage the release first (Release workflow)."
            exit 1
          fi
          echo "tag ${TAG} is on origin"

      # The gate that keeps this workflow honest: without it, a Release could be created for a
      # version that is still sitting in npm's stage queue.
      - name: Verify the version is on the registry
        env:
          VERSION: ${{ inputs.version }}
          PUBLISHED_JSON: ${{ runner.temp }}/published.json
        run: |
          set -euo pipefail
          if ! curl --fail --silent --show-error \
            "https://registry.npmjs.org/virtuo-scroll-area/${VERSION}" \
            > "$PUBLISHED_JSON"; then
            echo "::error::virtuo-scroll-area@${VERSION} is not on the registry yet."
            echo "Approve it on npmjs.com first: https://www.npmjs.com/package/virtuo-scroll-area"
            exit 1
          fi
          echo "virtuo-scroll-area@${VERSION} is live"

      # Provenance is the point of trusting CI to stage the package, so assert it.
      - name: Check the published provenance
        env:
          VERSION: ${{ inputs.version }}
          PUBLISHED_JSON: ${{ runner.temp }}/published.json
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const v = process.env.VERSION;
            const published = JSON.parse(fs.readFileSync(process.env.PUBLISHED_JSON, "utf8"));
            if (published.dist?.attestations) {
              console.log(`provenance attestation present for ${v}`);
            } else {
              console.log(`::warning::${v} carries no provenance attestation (staged by CI, but published outside trusted publishing?)`);
            }
          '

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Build the release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if node scripts/changelog-section.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"; then
            echo "mode=changelog" >> "$GITHUB_OUTPUT"
          else
            echo "mode=generated" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ inputs.version }}
          NOTES_MODE: ${{ steps.notes.outputs.mode }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "$TAG")
          case "$VERSION" in *-*) args+=(--prerelease) ;; esac
          if [ "$NOTES_MODE" = changelog ]; then
            args+=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            echo "::warning::CHANGELOG.md has no section for ${VERSION}; using generated notes."
            args+=(--generate-notes)
          fi
          gh release create "$TAG" "${args[@]}"

      - name: Job summary
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          {
            echo "### GitHub Release \`${TAG}\` created"
            echo
            echo "- npm: https://www.npmjs.com/package/virtuo-scroll-area/v/${VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
