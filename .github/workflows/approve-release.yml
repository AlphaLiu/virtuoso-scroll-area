name: Approve staged release

# Human half of staged publishing. `release.yml` uploads a tarball to npm's stage queue; nothing
# is installable until a maintainer approves it there. This workflow performs that approval and
# then creates the GitHub Release — which must only happen *after* the version really is live,
# because a Release pointing at a version nobody can install is worse than no Release at all.
#
# Both halves of the approval are rung by a person here, not by CI policy:
#   • the workflow is only ever started by hand (`workflow_dispatch`), and
#   • npm still demands a 2FA one-time password, so the OTP input is the proof of presence.
#
# See RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to approve (e.g. 0.3.0). Leave empty to use package.json.
        type: string
        required: false
      otp:
        description: 2FA one-time password from your authenticator app.
        type: string
        required: true

# One approval at a time: two runs racing for the same staged version would double-approve.
concurrency:
  group: approve-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  approve:
    name: Approve and release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC for the npm approval request
    steps:
      # The version is read from package.json on the default branch, *not* from the release tag:
      # `release.yml` stages the tag it just created, and by then `main` may already carry a
      # later version. The `version` input exists precisely to break that ambiguity.
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Ensure a recent npm
        run: |
          set -euo pipefail
          npm install --global 'npm@^11.15.0'
          echo "npm $(npm -v)"

      - name: Resolve the version to approve
        id: target
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          case "$version" in
            ''|*[!0-9A-Za-z.+-]*) echo "::error::invalid version '${version}'"; exit 1 ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Approving virtuo-scroll-area@${version}"

      # Validate the tag before spending a 2FA password on the approval: `gh release create`
      # below uses --verify-tag, and discovering a missing tag afterwards would waste the OTP.
      - name: Check the tag exists
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} is not on origin — stage the release first (Release workflow)."
            exit 1
          fi
          echo "tag ${TAG} is on origin"

      # `npm stage list` needs authentication but not 2FA, so a wrong version costs nothing.
      # The item shape is `{ id, packageName, version, tag, createdAt, actor, ... }`; `id` is the
      # UUID that `npm stage approve` takes (npm validates it as a UUID).
      - name: Find the staged package
        id: staged
        env:
          VERSION: ${{ steps.target.outputs.version }}
          # Passed as a path rather than as a CLI argument: `process.argv` indexing differs
          # between `node -e` and a script file, and an env var cannot be mis-indexed.
          STAGED_JSON: ${{ runner.temp }}/staged.json
        run: |
          set -euo pipefail
          npm stage list virtuo-scroll-area --json > "$STAGED_JSON"
          node -e '
            const fs = require("node:fs");
            const version = process.env.VERSION;
            // The item shape is `{ id, packageName, version, tag, createdAt, actor, ... }`; `id`
            // is the UUID that `npm stage approve` takes.
            const all = JSON.parse(fs.readFileSync(process.env.STAGED_JSON, "utf8")).items ?? [];
            const mine = all.filter(
              (item) => item.packageName === "virtuo-scroll-area" && item.version === version,
            );
            for (const item of all) {
              console.error(`  queued: ${item.packageName}@${item.version} (tag: ${item.tag}, id: ${item.id})`);
            }
            if (mine.length === 0) {
              console.error(`::error::nothing staged for virtuo-scroll-area@${version}`);
              process.exit(1);
            }
            if (mine.length > 1) {
              console.error(`::error::${mine.length} staged entries match ${version} — resolve manually with \`npm stage list\``);
              process.exit(1);
            }
            console.log(`id=${mine[0].id}`);
          ' >> "$GITHUB_OUTPUT"

      - name: Approve the staged package
        env:
          # npm reads the OTP from config/env, so it never reaches the command line. The value
          # is already masked because it came from a workflow input; add-mask is belt-and-braces
          # for the case where it gets echoed by a nested shell.
          NPM_CONFIG_OTP: ${{ inputs.otp }}
          STAGE_ID: ${{ steps.staged.outputs.id }}
        run: |
          set -euo pipefail
          echo "::add-mask::$NPM_CONFIG_OTP"
          if ! npm stage approve "$STAGE_ID"; then
            {
              echo '### Approval failed'
              echo
              echo 'The 2FA password may have expired. Retry with a fresh OTP, or approve locally:'
              echo
              echo '```bash'
              echo "npm stage approve ${STAGE_ID}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Approval returning success is not the same as the version being installable, and the
      # GitHub Release below must not be created for a version that never went live. Retrying
      # also absorbs registry read-after-write lag, so a lagging read does not look like failure.
      - name: Verify the version is on the registry
        env:
          VERSION: ${{ steps.target.outputs.version }}
          PUBLISHED_JSON: ${{ runner.temp }}/published.json
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error \
              "https://registry.npmjs.org/virtuo-scroll-area/${VERSION}" \
              > "$PUBLISHED_JSON"; then
              echo "virtuo-scroll-area@${VERSION} is live"
              exit 0
            fi
            echo "attempt ${attempt}/20: not on the registry yet, retrying in 15s…"
            sleep 15
          done
          echo "::error::virtuo-scroll-area@${VERSION} is still not on the registry after ~5 minutes."
          exit 1

      # Provenance is the point of the whole OIDC setup, so assert it rather than trust it.
      - name: Check the published provenance
        env:
          VERSION: ${{ steps.target.outputs.version }}
          PUBLISHED_JSON: ${{ runner.temp }}/published.json
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const v = process.env.VERSION;
            const published = JSON.parse(fs.readFileSync(process.env.PUBLISHED_JSON, "utf8"));
            if (published.dist?.attestations) {
              console.log(`provenance attestation present for ${v}`);
            } else {
              console.log(`::warning::${v} carries no provenance attestation (published outside trusted publishing?)`);
            }
          '

      - name: Build the release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          if node scripts/changelog-section.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"; then
            echo "mode=changelog" >> "$GITHUB_OUTPUT"
          else
            echo "mode=generated" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.target.outputs.version }}
          NOTES_MODE: ${{ steps.notes.outputs.mode }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "$TAG")
          case "$VERSION" in *-*) args+=(--prerelease) ;; esac
          if [ "$NOTES_MODE" = changelog ]; then
            args+=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            echo "::warning::CHANGELOG.md has no section for ${VERSION}; using generated notes."
            args+=(--generate-notes)
          fi
          gh release create "$TAG" "${args[@]}"

      - name: Job summary
        env:
          VERSION: ${{ steps.target.outputs.version }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          {
            echo "### virtuo-scroll-area@${VERSION} approved and released"
            echo
            echo "- npm: https://www.npmjs.com/package/virtuo-scroll-area/v/${VERSION}"
            echo "- GitHub Release: \`${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
